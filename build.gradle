plugins {
    id 'com.android.library'
    id 'dagger.hilt.android.plugin'
}

apply from: moduleGradle

android {
    namespace 'com.dp.notes'
    resourcePrefix "notes_"

    defaultConfig {
        ndk {
            abiFilters "armeabi-v7a", 'arm64-v8a', 'x86_64'
        }
    }
}

dependencies {
    //hilt
    implementation deps.Inject.hilt
    kapt deps.Inject.compiler
    //Arouter
    kapt deps.Arouter.compiler
    //-------
    implementation project(':module-common')
    compileOnly project(':module-webview')
    compileApi(':module-ztest-include')
    //-------
    implementation deps.Inject.koin
    implementation deps.Depend.flexbox
    //implementation 'com.tencent.mars:mars-xlog:1.2.5'
    implementation 'com.github.microshow:RxFFmpeg:4.9.0-lite'
    //implementation 'com.scwang.smart:refresh-layout-kernel:2.0.6'
    implementation 'com.scwang.smartrefresh:SmartRefreshLayout:1.0.4'
}